<nav class="pagination" aria-label="Phân trang">
  {% if page.page > 1 %}
  <a class="btn btn--quiet" href="{{ request.url.include_query_params(page=page.page - 1) }}" rel="prev">Trang trước</a>
  {% endif %}
  <span class="pagination__status" aria-current="page">Trang {{ page.page }}/{{ page.pages }}</span>
  {% if page.page < page.pages %}
  <a class="btn btn--quiet" href="{{ request.url.include_query_params(page=page.page + 1) }}" rel="next">Trang sau</a>
  {% endif %}
</nav>
