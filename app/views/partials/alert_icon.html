{% set kind = icon_kind or (flash.kind if flash else "error") %}
<svg width="18" height="18" viewBox="0 0 20 20" aria-hidden="true" focusable="false">
  {% if kind == "success" %}
  <circle cx="10" cy="10" r="9" fill="#4F7A28"/><path d="M6 10.5l2.5 2.5L14 7.5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  {% elif kind == "error" %}
  <circle cx="10" cy="10" r="9" fill="#B42318"/><path d="M10 5.5v5.5M10 14v.5" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  {% else %}
  <circle cx="10" cy="10" r="9" fill="#0E6E78"/><path d="M10 9v5.5M10 6v.5" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  {% endif %}
</svg>
